<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#0c111b; font-family:Inter, Pretendard, Arial, sans-serif; color:white; }
* { box-sizing:border-box; }
#game { position:relative; width:100%; height:100vh; min-height:520px; outline:none; }
canvas { display:block; width:100%; height:100%; }
.panel { position:absolute; z-index:5; background:rgba(10,15,24,.72); border:1px solid rgba(255,255,255,.12); backdrop-filter:blur(8px); border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.25); }
#hud { top:14px; left:14px; padding:12px 14px; min-width:230px; font-size:13px; line-height:1.55; pointer-events:none; }
#objective { top:14px; left:50%; transform:translateX(-50%); padding:12px 18px; text-align:center; min-width:340px; pointer-events:none; }
#objective strong { display:block; font-size:15px; margin-bottom:3px; }
#message { top:92px; left:50%; transform:translate(-50%,-8px); padding:11px 18px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; max-width:70%; text-align:center; }
#message.show { opacity:1; transform:translate(-50%,0); }
#interaction { bottom:26px; left:50%; transform:translateX(-50%); padding:10px 16px; opacity:0; transition:opacity .2s; pointer-events:none; }
#interaction.show { opacity:1; }
#focusHint { bottom:15px; right:15px; padding:8px 12px; font-size:12px; opacity:.78; pointer-events:none; }
#complete { inset:0; display:none; align-items:center; justify-content:center; background:rgba(5,8,13,.72); z-index:20; }
#complete.show { display:flex; }
.complete-card { background:#101827; border:1px solid rgba(255,255,255,.14); border-radius:18px; padding:28px 34px; text-align:center; min-width:300px; box-shadow:0 16px 60px rgba(0,0,0,.45); }
.complete-card h2 { margin:0 0 8px; font-size:28px; }
.complete-card p { opacity:.8; margin:0 0 18px; }
button { border:0; border-radius:10px; padding:10px 18px; font-weight:700; cursor:pointer; }
#debug { right:14px; top:14px; padding:10px 12px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; white-space:pre; pointer-events:none; max-width:310px; }
@media (max-width: 760px) {
  #hud { min-width:0; max-width:48%; font-size:11px; }
  #debug { display:none; }
  #objective { min-width:0; width:66%; font-size:11px; }
  #message { max-width:90%; width:max-content; }
}
</style>
</head>
<body>
<div id="game" tabindex="0">
  <div id="hud" class="panel"></div>
  <div id="objective" class="panel"></div>
  <div id="message" class="panel"></div>
  <div id="interaction" class="panel">E 키를 눌러 상호작용</div>
  <div id="debug" class="panel"></div>
  <div id="focusHint" class="panel">3D 화면 클릭 → 키보드 조작</div>
  <div id="complete">
    <div class="complete-card">
      <h2>Mission Complete</h2>
      <p>모든 필수 조건을 충족하고 목적지에 도착했습니다.</p>
      <button id="restartBtn">다시 시작</button>
    </div>
  </div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js';

const CONFIG = Object.freeze({
  debug: __DEBUG__,
  player: { radius:0.52, height:1.45, acceleration:20, deceleration:16, maxSpeed:__PLAYER_SPEED__, rotationSpeed:10 },
  camera: { distance:__CAMERA_DISTANCE__, height:__CAMERA_HEIGHT__, smooth:8, mouseSensitivity:0.005, minPitch:-0.15, maxPitch:0.75 },
  world: { minX:-18, maxX:18, minZ:-26, maxZ:12 },
  colors: { ground:0x26323c, player:0x4da3ff, wall:0x87909b, box:0xd89b48, gate:0xea5b5b, moving:0xb86ce5, destination:0x35d07f, path:0x52c7d9, trigger:0xffd166 }
});

const gameEl = document.getElementById('game');
const hudEl = document.getElementById('hud');
const objectiveEl = document.getElementById('objective');
const messageEl = document.getElementById('message');
const interactionEl = document.getElementById('interaction');
const debugEl = document.getElementById('debug');
const completeEl = document.getElementById('complete');
const restartBtn = document.getElementById('restartBtn');

const gameState = {
  started:true, completed:false, currentStage:0, playerControlEnabled:true,
  destinationReached:false, currentObjective:'게이트까지 이동하세요.', unlockedPaths:['intro'], removedObstacles:[], flags:{ gateOpened:false, finalPathUnlocked:false }
};

function setGameState(patch) { Object.assign(gameState, patch); }
function updateFlags(patch) { Object.assign(gameState.flags, patch); }
function resetGameState() {
  Object.assign(gameState, { started:true, completed:false, currentStage:0, playerControlEnabled:true, destinationReached:false, currentObjective:'게이트까지 이동하세요.', unlockedPaths:['intro'], removedObstacles:[] });
  gameState.flags = { gateOpened:false, finalPathUnlocked:false };
}

let renderer;
function detectWebGL() {
  const canvas = document.createElement('canvas');
  let webgl2 = false;
  let webgl1 = false;
  try { webgl2 = !!canvas.getContext('webgl2'); } catch (_) {}
  try { webgl1 = !!(canvas.getContext('webgl') || canvas.getContext('experimental-webgl')); } catch (_) {}
  return { webgl2, webgl1 };
}
try {
  renderer = new THREE.WebGLRenderer({ antialias:true });
} catch (err) {
  const support = detectWebGL();
  gameEl.innerHTML = `
    <div style="padding:30px;line-height:1.7;max-width:760px">
      <h3 style="margin-top:0">WebGL Renderer 초기화 실패</h3>
      <p>WebGL 2: <b>${support.webgl2 ? '사용 가능' : '사용 불가'}</b><br>
         WebGL 1: <b>${support.webgl1 ? '사용 가능' : '사용 불가'}</b></p>
      <p>이 호환판은 WebGL 1도 지원합니다. 둘 다 사용 불가라면 Chrome 설정 → 시스템 → <b>가능한 경우 그래픽 가속 사용</b>을 켠 뒤 브라우저를 다시 시작해 주세요.</p>
      <p style="opacity:.75">오류: ${String(err?.message || err)}</p>
    </div>`;
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
gameEl.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101722);
scene.fog = new THREE.Fog(0x101722, 30, 65);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 120);

const ambient = new THREE.HemisphereLight(0xddeeff, 0x27313b, 1.5);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(8,18,8); sun.castShadow = true; sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-25; sun.shadow.camera.right=25; sun.shadow.camera.top=30; sun.shadow.camera.bottom=-20;
scene.add(sun);

const groundMat = new THREE.MeshStandardMaterial({ color:CONFIG.colors.ground, roughness:0.92 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(42,46), groundMat);
ground.rotation.x = -Math.PI/2; ground.position.z=-7; ground.receiveShadow=true; scene.add(ground);
const grid = new THREE.GridHelper(42,42,0x536372,0x35434f); grid.position.set(0,.015,-7); scene.add(grid);

const sharedBoxGeo = new THREE.BoxGeometry(1,1,1);
const playerGeo = new THREE.CapsuleGeometry(CONFIG.player.radius, CONFIG.player.height, 6, 12);
const playerMat = new THREE.MeshStandardMaterial({ color:CONFIG.colors.player, roughness:.55 });
const player = new THREE.Mesh(playerGeo, playerMat);
player.castShadow=true; player.position.set(0,1.25,8); scene.add(player);
const playerSpawn = player.position.clone();
const playerState = { velocity:new THREE.Vector3(), facing:0, speedMultiplier:1 };

const obstacleDefs = [
  {id:'wallL', position:[-8,1.5,-2], size:[1,3,14], type:'wall', blocking:true, movable:false, visible:true, enabled:true},
  {id:'wallR', position:[8,1.5,-2], size:[1,3,14], type:'wall', blocking:true, movable:false, visible:true, enabled:true},
  {id:'box1', position:[-3,1,-1], size:[2.6,2,2.6], type:'box', blocking:true, movable:false, visible:true, enabled:true},
  {id:'box2', position:[3,1,-5], size:[2.4,2,2.4], type:'box', blocking:true, movable:false, visible:true, enabled:true},
  {id:'mover', position:[0,.8,-8], size:[2.4,1.6,1.8], type:'moving', blocking:true, movable:true, visible:true, enabled:true},
  {id:'gate', position:[0,1.5,-12], size:[5.4,3,.7], type:'gate', blocking:true, movable:false, visible:true, enabled:true},
  {id:'lateBox', position:[4,1,-17], size:[2,2,2], type:'box', blocking:true, movable:false, visible:true, enabled:false},
];
const obstacles = new Map();
const debugHelpers=[];
function colorForType(type){ return type==='gate'?CONFIG.colors.gate:type==='moving'?CONFIG.colors.moving:type==='box'?CONFIG.colors.box:CONFIG.colors.wall; }
function createObstacle(def){
  const mat=new THREE.MeshStandardMaterial({color:colorForType(def.type), roughness:.7});
  const mesh=new THREE.Mesh(sharedBoxGeo,mat); mesh.position.fromArray(def.position); mesh.scale.fromArray(def.size); mesh.castShadow=true; mesh.receiveShadow=true; mesh.visible=def.visible && def.enabled; scene.add(mesh);
  const obj={...def, mesh, initialPosition:new THREE.Vector3().fromArray(def.position), collider:new THREE.Box3()}; obstacles.set(def.id,obj); updateObstacleCollider(obj);
  if(CONFIG.debug){ const helper=new THREE.Box3Helper(obj.collider,0xff6677); helper.visible=def.enabled; scene.add(helper); obj.helper=helper; debugHelpers.push(helper); }
  return obj;
}
function updateObstacleCollider(obj){ obj.mesh.updateMatrixWorld(true); obj.collider.setFromObject(obj.mesh); }
obstacleDefs.forEach(createObstacle);

const destination = { position:new THREE.Vector3(0,.1,-22), radius:2.0 };
const destMesh=new THREE.Mesh(new THREE.CylinderGeometry(destination.radius,destination.radius,.18,40),new THREE.MeshStandardMaterial({color:CONFIG.colors.destination, emissive:0x0b4f2b, transparent:true, opacity:.82}));
destMesh.position.copy(destination.position); scene.add(destMesh);
const destRing=new THREE.Mesh(new THREE.TorusGeometry(destination.radius+.18,.07,10,50),new THREE.MeshBasicMaterial({color:0xaaffcc})); destRing.rotation.x=Math.PI/2; destRing.position.set(destination.position.x,.2,destination.position.z); scene.add(destRing);

const pathDefs=[
 {id:'intro', enabled:true, speedLimit:5.5, points:[[0,.06,8],[0,.06,3],[-1,.06,-2],[0,.06,-7],[0,.06,-11]], mode:'waypoint'},
 {id:'final', enabled:false, speedLimit:3.8, points:[[0,.06,-13],[-2,.06,-15],[-1,.06,-18],[0,.06,-22]], mode:'curve'}
];
const paths=new Map();
function makeLine(points, curveMode, color){
  const v=points.map(p=>new THREE.Vector3(...p));
  let curve, sampled;
  if(curveMode==='curve'){ curve=new THREE.CatmullRomCurve3(v); sampled=curve.getPoints(80); } else sampled=v;
  const geo=new THREE.BufferGeometry().setFromPoints(sampled); const mat=new THREE.LineBasicMaterial({color}); const line=new THREE.Line(geo,mat); scene.add(line); return {line, curve, points:v};
}
pathDefs.forEach(def=>{ const visual=makeLine(def.points,def.mode,CONFIG.colors.path); visual.line.visible=def.enabled; const p={...def,...visual}; paths.set(def.id,p); if(CONFIG.debug){ p.points.forEach(pt=>{ const m=new THREE.Mesh(new THREE.SphereGeometry(.13,8,8),new THREE.MeshBasicMaterial({color:CONFIG.colors.path}));m.position.copy(pt);m.visible=def.enabled;scene.add(m); }); }});

const triggerDefs=[
 {id:'gateNear',type:'area',position:[0,1,-10],size:[6,2.5,4],once:false,enabled:true},
 {id:'unlockFinal',type:'area',position:[0,1,-14.5],size:[6,2.5,3],once:true,enabled:true},
 {id:'slowZone',type:'area',position:[0,1,-6],size:[8,2.5,4],once:false,enabled:true}
];
const triggers=new Map();
function createTrigger(d){ const box=new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(...d.position),new THREE.Vector3(...d.size)); const t={...d,box,fired:false}; triggers.set(d.id,t); if(CONFIG.debug){ const h=new THREE.Box3Helper(box,CONFIG.colors.trigger); scene.add(h); t.helper=h; } }
triggerDefs.forEach(createTrigger);

const playerSphere=new THREE.Sphere(player.position.clone(),CONFIG.player.radius);
const tempPos=new THREE.Vector3(), tempMove=new THREE.Vector3(), tempDir=new THREE.Vector3(), tempBox=new THREE.Box3();
const clock=new THREE.Clock();

const input={forward:false,backward:false,left:false,right:false,interact:false};
const keyMap={KeyW:'forward',ArrowUp:'forward',KeyS:'backward',ArrowDown:'backward',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right'};
function handleKey(e,down){
  if(keyMap[e.code]){ input[keyMap[e.code]]=down; e.preventDefault(); }
  if(e.code==='KeyE' && down && !e.repeat){ input.interact=true; e.preventDefault(); }
  if(e.code==='KeyR' && down && !e.repeat){ restartGame(); e.preventDefault(); }
}
gameEl.addEventListener('keydown',e=>handleKey(e,true));
gameEl.addEventListener('keyup',e=>handleKey(e,false));
gameEl.addEventListener('pointerdown',()=>gameEl.focus());

let dragging=false,lastX=0,lastY=0,camYaw=0,camPitch=.28,eventFocus=null,focusBlend=0;
renderer.domElement.addEventListener('pointerdown',e=>{ dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture?.(e.pointerId);gameEl.focus(); });
renderer.domElement.addEventListener('pointermove',e=>{ if(!dragging||eventFocus)return; const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;camYaw-=dx*CONFIG.camera.mouseSensitivity;camPitch=THREE.MathUtils.clamp(camPitch-dy*CONFIG.camera.mouseSensitivity,CONFIG.camera.minPitch,CONFIG.camera.maxPitch); });
renderer.domElement.addEventListener('pointerup',()=>dragging=false); renderer.domElement.addEventListener('pointercancel',()=>dragging=false);

let messageTimer=0,eventToken=0;
function showMessage(text,seconds=2.4){ messageEl.textContent=text; messageEl.classList.add('show'); clearTimeout(messageTimer); messageTimer=setTimeout(()=>messageEl.classList.remove('show'),seconds*1000); }
function sequenceFocus(target,duration=1.5){
  const token=++eventToken; setGameState({playerControlEnabled:false}); eventFocus=target.clone(); focusBlend=0;
  setTimeout(()=>{ if(token!==eventToken)return; eventFocus=null; setTimeout(()=>{ if(token===eventToken && !gameState.completed) setGameState({playerControlEnabled:true}); },450); },duration*1000);
}
function removeObstacle(id){ const o=obstacles.get(id); if(!o)return; o.enabled=false;o.blocking=false;o.mesh.visible=false;if(o.helper)o.helper.visible=false;if(!gameState.removedObstacles.includes(id))gameState.removedObstacles.push(id); }
function activateObstacle(id){ const o=obstacles.get(id);if(!o)return;o.enabled=true;o.blocking=true;o.mesh.visible=true;if(o.helper)o.helper.visible=CONFIG.debug;updateObstacleCollider(o); }
function enablePath(id){ const p=paths.get(id);if(!p)return;p.enabled=true;p.line.visible=true;if(!gameState.unlockedPaths.includes(id))gameState.unlockedPaths.push(id); }

function playerIntersectsBox(box,position=player.position){ playerSphere.center.copy(position); return box.intersectsSphere(playerSphere); }
function blockingCollisionAt(position){
  for(const o of obstacles.values()){ if(!o.enabled||!o.blocking||!o.mesh.visible)continue; updateObstacleCollider(o); if(playerIntersectsBox(o.collider,position)) return o; }
  return null;
}
function applyWorldBoundary(pos){ pos.x=THREE.MathUtils.clamp(pos.x,CONFIG.world.minX+CONFIG.player.radius,CONFIG.world.maxX-CONFIG.player.radius); pos.z=THREE.MathUtils.clamp(pos.z,CONFIG.world.minZ+CONFIG.player.radius,CONFIG.world.maxZ-CONFIG.player.radius); pos.y=Math.min(pos.y,2); }
function getActiveSpeedLimit(){
  let limit=CONFIG.player.maxSpeed;
  const slow=triggers.get('slowZone'); if(slow && playerIntersectsBox(slow.box)) limit=Math.min(limit,2.6);
  for(const p of paths.values()){ if(!p.enabled)continue; let min=Infinity; const samples=p.curve?p.curve.getPoints(24):p.points; for(const pt of samples){ const dx=player.position.x-pt.x,dz=player.position.z-pt.z; min=Math.min(min,Math.hypot(dx,dz)); } if(min<1.8) limit=Math.min(limit,p.speedLimit); }
  return limit;
}
function applyMovementConstraints(pos){ applyWorldBoundary(pos); return pos; }
function updatePlayer(dt){
  if(!gameState.playerControlEnabled||gameState.completed){ playerState.velocity.multiplyScalar(Math.max(0,1-CONFIG.player.deceleration*dt)); return; }
  let ix=(input.right?1:0)-(input.left?1:0), iz=(input.backward?1:0)-(input.forward?1:0);
  tempDir.set(ix,0,iz); if(tempDir.lengthSq()>1)tempDir.normalize();
  if(tempDir.lengthSq()>0){
    tempDir.applyAxisAngle(new THREE.Vector3(0,1,0),camYaw);
    playerState.velocity.x=THREE.MathUtils.damp(playerState.velocity.x,tempDir.x*getActiveSpeedLimit(),CONFIG.player.acceleration,dt);
    playerState.velocity.z=THREE.MathUtils.damp(playerState.velocity.z,tempDir.z*getActiveSpeedLimit(),CONFIG.player.acceleration,dt);
    const targetFacing=Math.atan2(tempDir.x,tempDir.z); let diff=Math.atan2(Math.sin(targetFacing-player.rotation.y),Math.cos(targetFacing-player.rotation.y)); player.rotation.y+=diff*Math.min(1,CONFIG.player.rotationSpeed*dt);
  } else {
    playerState.velocity.x=THREE.MathUtils.damp(playerState.velocity.x,0,CONFIG.player.deceleration,dt);
    playerState.velocity.z=THREE.MathUtils.damp(playerState.velocity.z,0,CONFIG.player.deceleration,dt);
  }
  const speed=playerState.velocity.length(); const limit=getActiveSpeedLimit(); if(speed>limit)playerState.velocity.multiplyScalar(limit/speed);
  tempPos.copy(player.position); tempPos.x+=playerState.velocity.x*dt; applyMovementConstraints(tempPos); if(!blockingCollisionAt(tempPos)) player.position.x=tempPos.x; else playerState.velocity.x=0;
  tempPos.copy(player.position); tempPos.z+=playerState.velocity.z*dt; applyMovementConstraints(tempPos); if(!blockingCollisionAt(tempPos)) player.position.z=tempPos.z; else playerState.velocity.z=0;
  playerSphere.center.copy(player.position);
}

function updateMovingObstacles(t){ const o=obstacles.get('mover');if(!o||!o.enabled)return;o.mesh.position.x=Math.sin(t*.9)*4.4;updateObstacleCollider(o); }
function updateTriggers(){
  const gateNear=triggers.get('gateNear'); const nearGate=gateNear && playerIntersectsBox(gateNear.box) && !gameState.flags.gateOpened;
  interactionEl.classList.toggle('show',nearGate);
  if(nearGate && input.interact){ input.interact=false; updateFlags({gateOpened:true}); removeObstacle('gate'); setGameState({currentStage:1,currentObjective:'열린 게이트를 지나 안쪽 구역으로 이동하세요.'}); showMessage('게이트가 열렸습니다.'); sequenceFocus(new THREE.Vector3(0,1.5,-12),1.5); }
  const unlock=triggers.get('unlockFinal'); if(unlock && !unlock.fired && unlock.enabled && playerIntersectsBox(unlock.box) && gameState.flags.gateOpened){ unlock.fired=true;updateFlags({finalPathUnlocked:true});enablePath('final');activateObstacle('lateBox');setGameState({currentStage:2,currentObjective:'표시된 경로를 따라 최종 목적지로 이동하세요.'});showMessage('최종 경로가 활성화되었습니다.');sequenceFocus(destination.position,1.7); }
  input.interact=false;
}
function missingCompletionConditions(){ const missing=[];if(!gameState.flags.gateOpened)missing.push('게이트 열기');if(!gameState.flags.finalPathUnlocked)missing.push('최종 경로 활성화');if(!paths.get('final')?.enabled)missing.push('Final Path 활성화');return missing; }
function updateDestination(){
  if(gameState.completed)return; const dx=player.position.x-destination.position.x,dz=player.position.z-destination.position.z; if(Math.hypot(dx,dz)<=destination.radius){ const missing=missingCompletionConditions(); if(missing.length===0){ gameState.destinationReached=true;gameState.completed=true;gameState.playerControlEnabled=false;gameState.currentObjective='완료';completeEl.classList.add('show');sequenceFocus(destination.position,999); } else showMessage('완료 조건 부족: '+missing.join(', '),1.6); }
}
function updateCamera(dt){
  const target=eventFocus||player.position; if(eventFocus)focusBlend=Math.min(1,focusBlend+dt*2.5);else focusBlend=Math.max(0,focusBlend-dt*2.8);
  const look=new THREE.Vector3().copy(player.position).lerp(target,focusBlend); look.y+=.9;
  const dist=eventFocus?Math.max(5,CONFIG.camera.distance*.8):CONFIG.camera.distance;
  const horiz=dist*Math.cos(camPitch); const desired=new THREE.Vector3(look.x+Math.sin(camYaw)*horiz,look.y+CONFIG.camera.height+Math.sin(camPitch)*dist,look.z+Math.cos(camYaw)*horiz);
  camera.position.lerp(desired,1-Math.exp(-CONFIG.camera.smooth*dt)); camera.lookAt(look);
}
function updateUI(){
  hudEl.innerHTML=`<b>Status</b>: ${gameState.completed?'Complete':gameState.playerControlEnabled?'Playing':'Event'}<br><b>Stage</b>: ${gameState.currentStage}<br><b>Destination</b>: ${gameState.destinationReached?'Reached':'Waiting'}<br><b>Gate</b>: ${gameState.flags.gateOpened?'Open':'Locked'}<br><b>Final Path</b>: ${gameState.flags.finalPathUnlocked?'Unlocked':'Locked'}`;
  objectiveEl.innerHTML=`<strong>Objective</strong>${gameState.currentObjective}`;
  if(CONFIG.debug){ debugEl.style.display='block'; debugEl.textContent=`DEBUG\nposition: ${player.position.x.toFixed(2)}, ${player.position.y.toFixed(2)}, ${player.position.z.toFixed(2)}\nvelocity: ${playerState.velocity.x.toFixed(2)}, ${playerState.velocity.z.toFixed(2)}\nspeed: ${playerState.velocity.length().toFixed(2)}\ncontrol: ${gameState.playerControlEnabled}\npaths: ${gameState.unlockedPaths.join(', ')}\nremoved: ${gameState.removedObstacles.join(', ')||'-'}\nflags: ${JSON.stringify(gameState.flags)}`; } else debugEl.style.display='none';
}
function resize(){ const w=gameEl.clientWidth,h=gameEl.clientHeight||600;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false); }
const ro=new ResizeObserver(resize);ro.observe(gameEl);resize();

function restartGame(){
  ++eventToken; clearTimeout(messageTimer); messageEl.classList.remove('show');completeEl.classList.remove('show'); eventFocus=null;focusBlend=0;camYaw=0;camPitch=.28;resetGameState();player.position.copy(playerSpawn);player.rotation.set(0,0,0);playerState.velocity.set(0,0,0);
  for(const d of obstacleDefs){ const o=obstacles.get(d.id);o.enabled=d.enabled;o.blocking=d.blocking;o.mesh.position.fromArray(d.position);o.mesh.scale.fromArray(d.size);o.mesh.visible=d.visible&&d.enabled;if(o.helper)o.helper.visible=CONFIG.debug&&d.enabled;updateObstacleCollider(o); }
  for(const d of pathDefs){ const p=paths.get(d.id);p.enabled=d.enabled;p.line.visible=d.enabled; }
  for(const d of triggerDefs){ const t=triggers.get(d.id);t.enabled=d.enabled;t.fired=false; }
  showMessage('게임을 다시 시작했습니다.',1.3);gameEl.focus();
}
restartBtn.addEventListener('click',restartGame);

let elapsed=0;
function loop(){
  requestAnimationFrame(loop); const dt=Math.min(clock.getDelta(),.05);elapsed+=dt;
  updateMovingObstacles(elapsed);
  updatePlayer(dt);
  updateTriggers();
  updateDestination();
  updateCamera(dt);
  updateUI();
  destRing.rotation.z+=dt*.6;destMesh.material.emissiveIntensity=.8+.25*Math.sin(elapsed*3);
  renderer.render(scene,camera);
}
loop();

window.addEventListener('beforeunload',()=>{ ro.disconnect();renderer.dispose();sharedBoxGeo.dispose();playerGeo.dispose();ground.geometry.dispose();groundMat.dispose();playerMat.dispose(); });
showMessage('게이트로 이동한 뒤 E 키를 눌러보세요.',3.2);
setTimeout(()=>gameEl.focus(),150);
</script>
</body>
